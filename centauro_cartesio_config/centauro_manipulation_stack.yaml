solver_options:
    regularization: 1e-2
    back_end: osqp
    
stack:
    - [contact_1, contact_2, contact_3, contact_4, r_arm, l_arm, PelvisRot, Postural, Com]
    # - [Postural, Com, PelvisRot]

constraints: 
    - jlim
    - vlim
    - collision

jlim:
    type: JointLimits

vlim:
    type: VelocityLimits

collision:
    type: CollisionConstraint
    lib_name: libcartesio_collision_support.so
    bound_scaling: 0.1
    distance_threshold: 0.02
    detection_threshold: 0.10
    max_pairs: 60
    collision_urdf_path: $(ros2 pkg prefix --share centauro_urdf)/urdf/centauro_capsule.urdf
    collision_srdf_path: $(ros2 pkg prefix --share centauro_srdf)/srdf/centauro_capsule.srdf

contact_1:
    type: Cartesian
    distal_link: contact_1
    base_link: world
    indices: [0, 1, 2]
    
contact_2:
    type: Cartesian
    distal_link: contact_2
    base_link: world
    indices: [0, 1, 2]
    
contact_3:
    type: Cartesian
    distal_link: contact_3
    base_link: world
    indices: [0, 1, 2]
    
contact_4:
    type: Cartesian
    distal_link: contact_4
    base_link: world
    indices: [0, 1, 2]
    

l_arm:
    type: Cartesian
    distal_link: arm1_6
    base_link: world 
    # indices: [0, 1, 2, 3, 5]
    use_local_subtasks: true
    lambda: 0.1
    

r_arm:
    type: Cartesian
    distal_link: arm2_6
    base_link: world
    # indices: [0, 1, 2, 3, 5]
    use_local_subtasks: true
    lambda: 0.1
    
    
Com:
    type: Com
    indices: [0, 1]
    weight: 0.01
    
Postural:
    type: Postural
    lambda: 0.05
    weight: 0.001
    
PelvisRot:
    type: Cartesian
    distal_link: pelvis
    weight: 0.01
    indices: [4, 5]
