XBotInterface:
  urdf: ros2 run xbot2_ros topic_echo /robot_description
  srdf: ros2 run xbot2_ros topic_echo /robot_description_semantic


ModelInterface:
  model_type: pin


# hal
xbotcore_device_configs:
    sim: $(ros2 pkg prefix --share centauro_config)/hal/centauro_gz.yaml
    dummy: $(ros2 pkg prefix --share centauro_config)/hal/centauro_dummy.yaml


# threads
xbotcore_threads:
    rt_main:  {sched: fifo , prio: 60, period: 0.001, main: true}
    nrt_main: {sched: other, prio: 0 , period: 0.001}


# plugins
xbotcore_plugins:

    homing:
        thread: rt_main
        type: homing

    ros_io: {thread: nrt_main, type: ros2_io}

    ros_control: {thread: nrt_main, type: ros2_control, params: {autostart: true}}

    omnisteering:
      type: omnisteering_controller_plugin
      thread: nrt_main
      params:
        wheel_names: [wheel_1, wheel_2, wheel_3, wheel_4]
        wheel_radius: [0.124, 0.124, 0.124, 0.124]
        vel_offset_gain: 1.0


# global parameters
xbotcore_param:
  /xbot/hal/joint_safety/filter_autostart: false
  /xbot/hal/joint_safety/filter_cutoff_hz: 10.0
  /xbot/hal/enable_safety: false
  /xbot/hal/joint_safety/delta_check_dt: 0.020






