xbotcore_devices:

    joint_dummy:
        names: [__joint_srdf__]
        thread: rt_main

    joint_master:
        master: true  # this is a master device for 'joint'
        thread: rt_main
        
    joint_gripper_adapter:
        names: [dagana_1, dagana_2]
        thread: rt_main
        params:
            dagana_1/joint_name: {value: dagana_1_claw_joint, type: string}
            dagana_1/joint_type: {value: joint_dummy, type: string}
            dagana_1/qopen: {value: 1.23, type: double}
            dagana_1/qclosed: {value: 0.0, type: double}
            dagana_1/vmax: {value: 1.0, type: double}
            dagana_1/stiffness: {value: 10.0, type: double}

            dagana_2/joint_name: {value: dagana_2_claw_joint, type: string}
            dagana_2/joint_type: {value: joint_dummy, type: string}
            dagana_2/qopen: {value: 1.23, type: double}
            dagana_2/qclosed: {value: 0.06, type: double}
            dagana_2/vmax: {value: 10.0, type: double}
            dagana_2/stiffness: {value: 50.0, type: double}

